name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLIENT_SESSION_SECRET: ci-fixture-client-secret-not-for-production
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
      DIRECT_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
        if: ${{ !cancelled() }}
  reservations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: streammalin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d streammalin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/streammalin_test
      DIRECT_URL: postgresql://fixture:fixture@127.0.0.1:5432/streammalin_test
      TEST_DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/streammalin_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Create the pre-remediation schema in the disposable database
        run: |
          git show 8c9124180554849fa89dd9d5ab498684db444434:prisma/schema.prisma > prisma/remediation/ci-baseline.prisma
          npx prisma db push --schema prisma/remediation/ci-baseline.prisma --skip-generate
      - name: Verify the additive SQL on that baseline
        run: npx prisma db execute --file prisma/remediation/20261007_additive.sql --schema prisma/schema.prisma
      - run: npm run test:postgres
