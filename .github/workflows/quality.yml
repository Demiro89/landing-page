name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLIENT_SESSION_SECRET: ci-fixture-client-secret-not-for-production
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
      DIRECT_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
